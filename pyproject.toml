[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "all-to-pdf"
version = "0.1.0"
description = "Production-oriented PDF translation service that preserves layout"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "All_to_PDF contributors" }]
dependencies = [
  "aiofiles>=24,<25",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]
production = [
  "asyncpg>=0.30,<1",
  "redis>=6,<7",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
all-to-pdf-api = "all_to_pdf.main:run"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.coverage.run]
branch = true
source = ["all_to_pdf"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["all_to_pdf"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["all_to_pdf"]
mypy_path = "backend/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
