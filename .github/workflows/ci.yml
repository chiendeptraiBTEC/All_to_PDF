name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend/src backend/tests scripts/smoke_pdf_engine.py

      - name: Format check
        run: ruff format --check backend/src backend/tests scripts/smoke_pdf_engine.py

      - name: Type check
        run: mypy

      - name: Test and coverage
        run: pytest --cov=all_to_pdf --cov-report=term-missing --cov-report=xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag all-to-pdf:${{ github.sha }} .
      - name: Verify non-root user
        run: docker run --rm all-to-pdf:${{ github.sha }} id -u | grep -v '^0$'

  engine-smoke:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache BabelDOC assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/babeldoc
            ~/.cache/huggingface
          key: >-
            babeldoc-${{ runner.os }}-38d3896dcde9-
            f8dffcf4c3a3-v1

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install --yes libgl1 libglib2.0-0

      - name: Install application
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Install pinned PDF engine
        run: ./scripts/install_pdf_engine.sh

      - name: Translate fixture through real BabelDOC
        run: python scripts/smoke_pdf_engine.py --output-directory artifacts/engine-smoke

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-smoke-${{ github.sha }}
          path: artifacts/engine-smoke
          if-no-files-found: warn
          retention-days: 14
