name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check backend/src backend/tests

      - name: Format check
        run: ruff format --check backend/src backend/tests

      - name: Type check
        run: mypy

      - name: Test and coverage
        run: pytest --cov=all_to_pdf --cov-report=term-missing --cov-report=xml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        run: node --check frontend/app.js

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag all-to-pdf:${{ github.sha }} .
      - name: Verify non-root user
        run: docker run --rm all-to-pdf:${{ github.sha }} id -u | grep -v '^0$'
